epl_pipeline:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'postgres') }}"
      port: 5432
      user: "{{ env_var('POSTGRES_USER', 'epl_user') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'epl_pass') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'epl_pipeline') }}"
      schema: public
      threads: 4
